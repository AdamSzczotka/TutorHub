{% extends "admin_panel/base.html" %}

{% block title %}{{ title }} - Panel Admina{% endblock %}

{% block content %}
<div class="p-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">{{ title }}</h1>
        <a href="{% url 'accounts:activity-list' %}" class="btn btn-sm btn-ghost">&larr; Wszystkie aktywności</a>
    </div>

    <div class="card bg-base-100 shadow">
        <div class="card-body p-0">
            <div id="activity-table">
                {% include "admin_panel/users/activity/partials/_activity_table.html" %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
